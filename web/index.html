<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1769FF">
  <meta name="description" content="Format text, code, links, tables and receipts.">
  <title>Format Anything</title>
  <!-- Load Tesseract before Flutter starts so browser OCR is available on web. -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    window.formatAnythingRecognize = async function (imageUrl, language) {
      if (!window.Tesseract || typeof window.Tesseract.recognize !== 'function') {
        throw new Error('Tesseract.js did not load. Check your internet connection.');
      }
      const result = await window.Tesseract.recognize(imageUrl, language);
      return (result && result.data && result.data.text) || '';
    };
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
