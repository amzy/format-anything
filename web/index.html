<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1769FF">
  <meta name="description" content="Format text, code, links, tables and receipts.">
  <title>Format Anything</title>
  <!-- Pin the OCR engine version so its API remains predictable. -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    (() => {
      let workerPromise;

      function getWorker(language) {
        if (!workerPromise) {
          workerPromise = window.Tesseract.createWorker(language, 1, {
            logger: () => {}
          }).catch((error) => {
            workerPromise = null;
            throw error;
          });
        }
        return workerPromise;
      }

      function loadImage(source) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error('The selected image could not be opened.'));
          image.src = source;
        });
      }

      // Upscale small receipt photos, convert to grayscale and expand contrast.
      // Keep the original color image available as an alternative OCR input.
      function makeVariants(image) {
        const maxDimension = 2600;
        const scale = Math.min(2.5, maxDimension / Math.max(image.naturalWidth, image.naturalHeight));
        const width = Math.max(1, Math.round(image.naturalWidth * scale));
        const height = Math.max(1, Math.round(image.naturalHeight * scale));
        const base = document.createElement('canvas');
        base.width = width;
        base.height = height;
        const context = base.getContext('2d', { willReadFrequently: true });
        if (!context) throw new Error('Image preprocessing is not supported by this browser.');
        context.fillStyle = '#ffffff';
        context.fillRect(0, 0, width, height);
        context.drawImage(image, 0, 0, width, height);

        const gray = document.createElement('canvas');
        gray.width = width;
        gray.height = height;
        const grayContext = gray.getContext('2d', { willReadFrequently: true });
        if (!grayContext) throw new Error('Could not prepare the receipt image.');
        grayContext.drawImage(base, 0, 0);
        const pixels = grayContext.getImageData(0, 0, width, height);
        const data = pixels.data;

        // Contrast stretch using luminance percentiles; this improves faded thermal print
        // without applying a harsh fixed threshold that can erase dollar signs and decimals.
        const histogram = new Uint32Array(256);
        for (let i = 0; i < data.length; i += 4) {
          const luminance = Math.round(0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2]);
          histogram[luminance]++;
        }
        const total = width * height;
        function percentile(target) {
          let count = 0;
          for (let i = 0; i < histogram.length; i++) {
            count += histogram[i];
            if (count >= target) return i;
          }
          return 255;
        }
        const low = percentile(total * 0.03);
        const high = percentile(total * 0.97);
        const range = Math.max(1, high - low);
        for (let i = 0; i < data.length; i += 4) {
          const luminance = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          const adjusted = Math.max(0, Math.min(255, Math.round((luminance - low) * 255 / range)));
          data[i] = adjusted;
          data[i + 1] = adjusted;
          data[i + 2] = adjusted;
          data[i + 3] = 255;
        }
        grayContext.putImageData(pixels, 0, 0);

        // A second, softly thresholded variant helps high-contrast thermal receipts.
        // It is deliberately not pure black/white to preserve punctuation and currency marks.
        const threshold = document.createElement('canvas');
        threshold.width = width;
        threshold.height = height;
        const thresholdContext = threshold.getContext('2d', { willReadFrequently: true });
        if (!thresholdContext) return [gray.toDataURL('image/png'), base.toDataURL('image/png')];
        thresholdContext.drawImage(gray, 0, 0);
        const thresholdPixels = thresholdContext.getImageData(0, 0, width, height);
        for (let i = 0; i < thresholdPixels.data.length; i += 4) {
          const value = thresholdPixels.data[i];
          const adjusted = value < 145 ? Math.max(0, value - 35) : Math.min(255, value + 35);
          thresholdPixels.data[i] = adjusted;
          thresholdPixels.data[i + 1] = adjusted;
          thresholdPixels.data[i + 2] = adjusted;
        }
        thresholdContext.putImageData(thresholdPixels, 0, 0);

        return [
          gray.toDataURL('image/png'),
          threshold.toDataURL('image/png'),
          base.toDataURL('image/png')
        ];
      }

      function score(result) {
        const text = (result && result.data && result.data.text || '').trim();
        if (!text) return -1;
        const confidence = Number(result.data.confidence) || 0;
        const useful = (text.match(/[A-Za-z0-9$€£₹¥]/g) || []).length;
        const replacement = (text.match(/[�]/g) || []).length;
        const receiptTerms = (text.match(/subtotal|total|tax|amount|balance|receipt|date|qty|change/gi) || []).length;
        // Confidence matters most; reward meaningful content and receipt structure.
        return confidence + Math.min(useful, 500) * 0.025 + receiptTerms * 1.5 - replacement * 4;
      }

      window.formatAnythingRecognize = async function (imageUrl, language) {
        if (!window.Tesseract || typeof window.Tesseract.createWorker !== 'function') {
          throw new Error('Tesseract.js did not load. Check your internet connection.');
        }
        const image = await loadImage(imageUrl);
        if (!image.naturalWidth || !image.naturalHeight) {
          throw new Error('The selected image has no readable dimensions.');
        }
        const variants = makeVariants(image);
        const worker = await getWorker(language || 'eng');
        let best = null;
        let bestScore = -1;

        // Receipt lines are usually laid out in blocks; sparse-text mode is also
        // tested because footer text and separated prices can be missed by block mode.
        for (let index = 0; index < variants.length; index++) {
          for (const pageMode of ['6', '11']) {
            await worker.setParameters({
              tessedit_pageseg_mode: pageMode,
              preserve_interword_spaces: '1'
            });
            const result = await worker.recognize(variants[index]);
            const currentScore = score(result);
            if (currentScore > bestScore) {
              best = result;
              bestScore = currentScore;
            }
          }
        }
        return (best && best.data && best.data.text || '').trim();
      };
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
