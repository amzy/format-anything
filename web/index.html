<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">
  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1769FF">
  <meta name="description" content="Format text, code, links, tables and receipts.">
  <title>Format Anything</title>
  <!-- Pin the OCR engine version so its API remains predictable. -->
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <script>
    (() => {
      let workerPromise;

      function getWorker(language) {
        if (!workerPromise) {
          workerPromise = window.Tesseract.createWorker(language, 1, {
            logger: () => {}
          }).catch((error) => {
            workerPromise = null;
            throw error;
          });
        }
        return workerPromise;
      }

      function loadImage(source) {
        return new Promise((resolve, reject) => {
          const image = new Image();
          image.onload = () => resolve(image);
          image.onerror = () => reject(new Error('The selected image could not be opened.'));
          image.src = source;
        });
      }

      // Benchmark-winning primary input: 2x Lanczos upscale, no destructive threshold.
      // Cap the largest output dimension to avoid excessive browser memory on huge photos.
      function makeBaseline(image) {
        const maxDimension = 3200;
        const scale = Math.min(2, maxDimension / Math.max(image.naturalWidth, image.naturalHeight));
        const width = Math.max(1, Math.round(image.naturalWidth * scale));
        const height = Math.max(1, Math.round(image.naturalHeight * scale));
        const canvas = document.createElement('canvas');
        canvas.width = width;
        canvas.height = height;
        const context = canvas.getContext('2d');
        if (!context) throw new Error('Image preprocessing is not supported by this browser.');
        context.fillStyle = '#ffffff';
        context.fillRect(0, 0, width, height);
        context.imageSmoothingEnabled = true;
        context.imageSmoothingQuality = 'high';
        context.drawImage(image, 0, 0, width, height);
        return canvas;
      }

      // Fallback candidates are only evaluated when the benchmark baseline is weak.
      // Contrast stretch is deliberately a fallback rather than the default, preserving
      // the exact baseline that produced the best field-evaluator coverage.
      function makeFallbacks(baseline) {
        const gray = document.createElement('canvas');
        gray.width = baseline.width;
        gray.height = baseline.height;
        const context = gray.getContext('2d', { willReadFrequently: true });
        if (!context) return [baseline];
        context.drawImage(baseline, 0, 0);
        const imageData = context.getImageData(0, 0, gray.width, gray.height);
        const data = imageData.data;
        const histogram = new Uint32Array(256);
        for (let i = 0; i < data.length; i += 4) {
          histogram[Math.round(0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2])]++;
        }
        const total = gray.width * gray.height;
        function percentile(target) {
          let count = 0;
          for (let i = 0; i < histogram.length; i++) {
            count += histogram[i];
            if (count >= target) return i;
          }
          return 255;
        }
        const low = percentile(total * 0.03);
        const high = percentile(total * 0.97);
        const range = Math.max(1, high - low);
        for (let i = 0; i < data.length; i += 4) {
          const luminance = 0.299 * data[i] + 0.587 * data[i + 1] + 0.114 * data[i + 2];
          const adjusted = Math.max(0, Math.min(255, Math.round((luminance - low) * 255 / range)));
          data[i] = adjusted;
          data[i + 1] = adjusted;
          data[i + 2] = adjusted;
          data[i + 3] = 255;
        }
        context.putImageData(imageData, 0, 0);
        return [gray, baseline];
      }

      function score(result) {
        const text = (result && result.data && result.data.text || '').trim();
        if (!text) return -1;
        const confidence = Number(result.data.confidence) || 0;
        const useful = (text.match(/[A-Za-z0-9$€£₹¥]/g) || []).length;
        const replacement = (text.match(/[�]/g) || []).length;
        const receiptTerms = (text.match(/subtotal|total|tax|amount|balance|receipt|date|qty|change/gi) || []).length;
        // Confidence matters most; reward meaningful content and receipt structure.
        return confidence + Math.min(useful, 500) * 0.025 + receiptTerms * 1.5 - replacement * 4;
      }

      window.formatAnythingRecognize = async function (imageUrl, language) {
        if (!window.Tesseract || typeof window.Tesseract.createWorker !== 'function') {
          throw new Error('Tesseract.js did not load. Check your internet connection.');
        }
        const image = await loadImage(imageUrl);
        if (!image.naturalWidth || !image.naturalHeight) {
          throw new Error('The selected image has no readable dimensions.');
        }

        const baseline = makeBaseline(image);
        const worker = await getWorker(language || 'eng');
        await worker.setParameters({
          tessedit_pageseg_mode: '11',
          preserve_interword_spaces: '1'
        });
        const primary = await worker.recognize(baseline);
        let best = primary;
        let bestScore = score(primary);

        // The 2x + PSM 11 run is always the first and preferred attempt.
        // Only spend extra OCR passes when output is empty/short or confidence is low.
        const primaryText = (primary && primary.data && primary.data.text || '').trim();
        const primaryConfidence = Number(primary && primary.data && primary.data.confidence) || 0;
        const needsFallback = primaryText.length < 24 || primaryConfidence < 62;
        if (needsFallback) {
          const fallbacks = makeFallbacks(baseline);
          const candidates = [
            { image: fallbacks[0], psm: '6' },
            { image: fallbacks[fallbacks.length - 1], psm: '11' }
          ];
          for (const candidate of candidates) {
            await worker.setParameters({
              tessedit_pageseg_mode: candidate.psm,
              preserve_interword_spaces: '1'
            });
            const result = await worker.recognize(candidate.image);
            const candidateScore = score(result);
            if (candidateScore > bestScore) {
              best = result;
              bestScore = candidateScore;
            }
          }
        }

        return (best && best.data && best.data.text || '').trim();
      };
    })();
  </script>
</head>
<body>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
